<style>
:root{--panel:rgba(255,255,255,.95);--ink:#14213d;--soft:#51607a;--line:#c9d6e2;--gold:#f4b400;--gold-ink:#3a2600;--glass:rgba(20,33,61,.72);--bg:#8fd3f4}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5}
#top{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--glass);color:#fff;border:0;border-radius:999px;padding:6px 14px;font:700 18px inherit;font-family:inherit;min-height:44px;cursor:pointer}
#goal{left:12px;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--glass);color:#fff;border-radius:12px;padding:4px 12px;font-size:15px}

#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}

#panel{inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#box{background:var(--panel);color:var(--ink);border-radius:20px;padding:16px;width:100%;max-width:520px;max-height:100%;overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#box h2{margin:0 0 6px;font-size:23px}
.info{font-size:19px;line-height:1.6;margin:6px 0 12px}
.info b{background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:0 5px}
.q{font-weight:700;font-size:20px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button:last-child{grid-column:1/-1}
.btn{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;min-height:48px;font:700 18px inherit;font-family:inherit;cursor:pointer;padding:6px 10px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.4}
.btn.wide{width:100%;margin-top:10px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:26px;margin-top:10px;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border-radius:10px;padding:2px 10px;color:#14213d}
#up{right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(66,153,225,.85);font-size:30px;display:none;touch-action:none}

</style>
